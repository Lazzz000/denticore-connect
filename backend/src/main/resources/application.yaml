server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1

spring:
  application:
    name: denticore-backend
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:denticoredb}
    username: ${DB_USER:denticore_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000

  # ==========================================
  # CONFIGURACIÓN DE HIBERNATE / JPA
  # ==========================================
  jpa:
    hibernate:
      ddl-auto: validate # Valida que Java y SQL coincidan. No altera la BD.
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration${FLYWAY_DEMO_LOCATION:}
    validate-on-migrate: true

# ==========================================
# CONFIGURACIÓN DE ACTUATOR (Métricas y Salud)
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

# ==========================================
# CONFIGURACIÓN JWT
# ==========================================
jwt:
  secret: ${JWT_SIGNING_SECRET:}
  expiration: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  demo:
    patient-dni: ${DEMO_PATIENT_DNI:}
    patient-email: ${DEMO_PATIENT_EMAIL:}
    patient-password: ${DEMO_PATIENT_PASSWORD:}
    patient-names: ${DEMO_PATIENT_NAMES:Diego Alonso}
    patient-surnames: ${DEMO_PATIENT_SURNAMES:Ramírez Torres}
