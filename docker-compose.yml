services:
  denticore-db:
    image: postgres:16-alpine
    container_name: denticore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-denticoredb}
      POSTGRES_USER: ${POSTGRES_USER:-denticore_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu entorno}
      TZ: ${TZ:-America/Lima}
    ports:
      - "5432:5432"
    volumes:
      - denticore-pgdata:/var/lib/postgresql/data
    networks:
      - denticore-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  denticore-network:
    driver: bridge

volumes:
  denticore-pgdata:
    name: denticore_pg_volume
